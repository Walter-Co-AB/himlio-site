name: CI

# The package's tests, and the starter built and screenshotted exactly as a site's CI does it,
# through the reusable build workflow, against the package in this commit.
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: The packed package has what sites need
        working-directory: packages/site
        run: |
          npm pack --dry-run --json > pack.json
          node -e '
            const files = require("./pack.json")[0].files.map((f) => f.path);
            for (const want of ["dist/index.js", "dist/runtime/worker.js", "cli/himlio-site.mjs", "migrations/0001_himlio_sessions.sql", "model-migrations/0001_company.json", "LICENSE"])
              if (!files.includes(want)) { console.error("missing from the package: " + want); process.exit(1); }
            if (files.some((f) => f.startsWith("src/") || f.startsWith("test/"))) { console.error("src/ or test/ in the package"); process.exit(1); }
            console.log(files.length + " files");'

  starter:
    name: Starter
    uses: ./.github/workflows/build.yml
    with:
      working-directory: starter
      setup-command: npm run build -w @himlio/site
