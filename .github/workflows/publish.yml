name: Publish

# Publishes @himlio/site to npm when a version tag (v1.2.3) is pushed, with npm Trusted
# Publishing (GitHub OIDC, provenance): no npm token is stored anywhere. The trusted publisher
# for this repo and workflow is configured on npmjs.com after the first, manual 1.0.0.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: npm
      - name: npm must support trusted publishing (11.5.1 or later)
        run: npx --yes semver@7.7.2 -r '>=11.5.1' "$(npm --version)"
      - run: npm ci
      - name: The tag matches the package version
        run: |
          version=$(node -p 'require("./packages/site/package.json").version')
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Skip a version that is already on npm (1.0.0 was published by hand)
        id: published
        run: |
          version=$(node -p 'require("./packages/site/package.json").version')
          if npm view "@himlio/site@$version" version >/dev/null 2>&1; then
            echo "@himlio/site@$version is already on npm; nothing to publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.exists != 'true'
        run: npm run build
      - if: steps.published.outputs.exists != 'true'
        run: npm test
      - if: steps.published.outputs.exists != 'true'
        run: npm publish --provenance --access public
        working-directory: packages/site
