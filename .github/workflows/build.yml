name: Himlio build

# Reusable workflow for every Himlio site. A site's .github/workflows/ci.yml is:
#
#   on: [push, pull_request, workflow_dispatch]
#   permissions: { contents: read }
#   jobs:
#     himlio:
#       uses: Walter-Co-AB/himlio-site/.github/workflows/build.yml@vX.Y.Z (the @himlio/site version)
#
# On every push and pull request it checks and builds the site. On pushes to main it uploads
# the `himlio-build` artifact the platform releases (packages/site/docs/build-artifact.md). On
# pull requests it uploads `screenshots` of the site with sample content and empty. No secrets.
on:
  workflow_call:
    inputs:
      working-directory:
        description: The site's directory in the repo.
        type: string
        default: .
      setup-command:
        description: Run after npm ci, in the repo root (himlio-site uses it to build the package).
        type: string
        default: ''
      screenshot-pages:
        description: >-
          Space-separated paths to screenshot. Empty: himlio-site's defaults (home, about and
          contact in the site's language, the block gallery and a missing page).
        type: string
        default: ''

permissions:
  contents: read

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - if: inputs.setup-command != ''
        run: ${{ inputs.setup-command }}
        working-directory: .
      - run: npm run format:check --if-present
      - run: npm run check --if-present
      - run: npm test --if-present
      - run: npx himlio-site build
      - if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: himlio-build
          path: ${{ inputs.working-directory }}/himlio-build/
          include-hidden-files: false
          if-no-files-found: error

  screenshots:
    name: Screenshots
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.working-directory }}/.nvmrc
          cache: npm
      - run: npm ci
        working-directory: .
      - if: inputs.setup-command != ''
        run: ${{ inputs.setup-command }}
        working-directory: .
      - run: npx himlio-site install-browsers
      - name: Start the dev server
        run: |
          npx himlio-site dev > dev-server.log 2>&1 &
          port=$(npx himlio-site port)
          for i in $(seq 1 90); do curl -fsS -o /dev/null "http://localhost:$port/" && exit 0; sleep 2; done
          cat dev-server.log; exit 1
      - run: npx himlio-site fixtures --empty
      - run: npx himlio-site screenshots --out screenshots/empty ${{ inputs.screenshot-pages }}
      - run: npx himlio-site fixtures
      - run: npx himlio-site screenshots --out screenshots/sample ${{ inputs.screenshot-pages }}
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            ${{ inputs.working-directory }}/screenshots/
            ${{ inputs.working-directory }}/dev-server.log
          if-no-files-found: warn
