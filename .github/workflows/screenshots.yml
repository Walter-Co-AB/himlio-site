name: Screenshots

# Owned by the Himlio platform. Screenshots of the site with sample content and empty, in light,
# dark and mobile, uploaded as the `screenshots` artifact, so a design change can be judged
# without merging it. Uses no secrets; nothing is deployed.
on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: screenshots-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  screenshots:
    name: Screenshots
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Start the dev server
        run: |
          npm run dev > dev-server.log 2>&1 &
          port=$(node -e "import('./himlio.config.mjs').then(m => console.log(m.devPort(require('./himlio.json').slug)))")
          echo "PORT=$port" >> "$GITHUB_ENV"
          for i in $(seq 1 90); do curl -fsS -o /dev/null "http://localhost:$port/" && exit 0; sleep 2; done
          cat dev-server.log; exit 1
      - run: npm run dev:fixtures -- --empty
      - run: npm run screenshots -- --out screenshots/empty
      - run: npm run dev:fixtures
      - run: npm run screenshots -- --out screenshots/sample
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: screenshots
          path: |
            screenshots/
            dev-server.log
          if-no-files-found: warn
