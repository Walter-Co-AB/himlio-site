# Sveltia CMS configuration (https://sveltiacms.app/en/docs).
#
# The backend, site_url and display_url settings are added at build time from
# site.config.json by src/pages/admin/config.yml.ts, which serves the result at
# /admin/config.yml. Don't add them here.
#
# Fields must match the Zod schemas in src/schemas.ts. `npm run check:cms` checks this.

logo_url: /favicon.svg

# Images are stored next to the entry that uses them.
media_folder: ''
public_folder: ''

output:
  omit_empty_optional_fields: true

collections:
  - name: pages
    label: Sidor
    label_singular: Sida
    icon: description
    folder: src/content/pages
    path: '{{slug}}/index'
    slug: '{{title}}'
    create: true
    summary: '{{title}}'
    sortable_fields: [title, menu]
    preview_path: '/{{slug}}/'
    fields:
      - { name: title, label: Rubrik }
      - name: description
        label: Beskrivning
        widget: text
        hint: Visas i sökresultat och när sidan delas. En till två meningar.
      - name: menu
        label: Plats i menyn
        widget: number
        value_type: int
        required: false
        hint: 1 för först. Lämna tomt för att inte visa sidan i menyn.
      - { name: image, label: Bild, widget: image, required: false }
      - name: imageAlt
        label: Bildbeskrivning
        required: false
        hint: Beskriv bilden för den som inte ser den.
      - { name: draft, label: Utkast (visas inte), widget: boolean, default: false }
      - { name: body, label: Text, widget: markdown }

  - name: settings
    label: Inställningar
    icon: settings
    files:
      - name: site
        label: Webbplatsen
        file: src/content/settings/site.json
        format: json
        fields:
          - { name: name, label: Namn }
          - { name: description, label: Kort beskrivning, widget: text }
          - { name: email, label: E-post, required: false }
          - { name: phone, label: Telefon, required: false }
          - { name: address, label: Adress, widget: text, required: false }
          - { name: orgNumber, label: Organisationsnummer, required: false }
          - name: colors
            label: Färger
            widget: object
            fields:
              - { name: primary, label: Huvudfärg, widget: color }
              - { name: background, label: Bakgrund, widget: color }
              - { name: text, label: Text, widget: color }
